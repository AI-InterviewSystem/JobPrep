spring.application.name=backend

server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/ai-interview
server.servlet.session.cookie.path=/ai-interview
server.servlet.session.cookie.same-site=None
server.servlet.session.cookie.secure=true

spring.cloud.config.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000

resilience4j.ratelimiter.instances.chat-limit.limit-for-period=5
resilience4j.ratelimiter.instances.chat-limit.limit-refresh-period=60s
resilience4j.ratelimiter.instances.chat-limit.timeout-duration=0s
resilience4j.ratelimiter.instances.chat-limit.subscribe-for-events=true
resilience4j.ratelimiter.instances.chat-limit.register-health-indicator=true

logging.level.io.github.resilience4j=DEBUG

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.jwt.secret=${APP_JWT_SECRET}
app.frontend.url=${APP_FRONTEND_URL}

app.reminders.poll-interval-ms=30000

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket.avatar=avatar
supabase.bucket.cvs=cvs

payos.client-id=${PAYOS_CLIENT_ID}
payos.api-key=${PAYOS_API_KEY}
payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payos.exchange-rate-usd-vnd=26000

ai.server.url=${AI_SERVER_URL}